site_name: OPNsense for Mere Mortals
site_description: A FreeBSD firewall and routing platform you run on your own hardware. Choosing a box and an image, proving the download with checksums and signatures, reading the factory configuration, and the working core of rules, NAT, DNS, VPNs and updates, with the limits stated plainly.
